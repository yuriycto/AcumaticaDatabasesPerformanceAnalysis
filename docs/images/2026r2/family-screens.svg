<text x="24" y="270" font-size="13.5" font-weight="600" fill="#4b5563">No noticeable difference</text>
<text x="24" y="288" font-size="13" fill="#4b5563">MySQL is 29% slower, but that is only 16.4 ms more</text>
<text x="24" y="305" font-size="13" fill="#4b5563">per order opened (noticeable from 100 ms).</text>
<text x="458" y="248" font-size="12.5" fill="#4b5563">ms per order opened · lower is better</text>
