<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="speedup-core-title speedup-core-desc">
<title id="speedup-core-title">Does sharing a job among 8 workers help?</title>
<desc id="speedup-core-desc">Yes, but far from 8×: with one job shared by 8 workers, each job finished 1.7–3.7× faster than with 1 worker (8× would be a perfect split). Acumatica ran on about 2 processor cores on every database, which limits the gain. Load 10,000 records: 8 workers: 2.1–3.7× faster (SQL Server 3.70× faster, 0.219 s → 0.0592 s per 10,000-record job; MySQL 2.62× faster, 0.259 s → 0.0985 s per 10,000-record job; PostgreSQL 2.11× faster, 0.111 s → 0.0525 s per 10,000-record job). Save 10,000 new records: 8 workers: 1.7–2.2× faster (SQL Server 1.68× faster, 7.57 s → 4.51 s per 10,000-record job; MySQL 2.11× faster, 9.34 s → 4.42 s per 10,000-record job; PostgreSQL 2.17× faster, 11.8 s → 5.44 s per 10,000-record job). Change 10,000 records: 8 workers: 1.8–2.3× faster (SQL Server 1.82× faster, 5.73 s → 3.15 s per 10,000-record job; MySQL 2.30× faster, 7.03 s → 3.06 s per 10,000-record job; PostgreSQL 2.34× faster, 8.23 s → 3.51 s per 10,000-record job). Delete 10,000 records: 8 workers: 1.8–2.5× faster (SQL Server 1.79× faster, 24.1 s → 13.4 s per 10,000-record job; MySQL 2.26× faster, 36.9 s → 16.4 s per 10,000-record job; PostgreSQL 2.54× faster, 37.4 s → 14.7 s per 10,000-record job). Stock availability list, all columns: 8 workers: 2.2–2.4× faster (SQL Server 2.23× faster, 118 ms → 53 ms per list page; MySQL 2.41× faster, 116 ms → 48.1 ms per list page; PostgreSQL 2.18× faster, 112 ms → 51.4 ms per list page). Stock availability list, only the needed columns: 8 workers: 1.7–2.8× faster (SQL Server 1.74× faster, 23.8 ms → 13.7 ms per list page; MySQL 1.80× faster, 32.7 ms → 18.2 ms per list page; PostgreSQL 2.76× faster, 34 ms → 12.3 ms per list page). Speed-ups are not ranked; all bars have one neutral colour.</desc>
<rect x="0.5" y="0.5" width="959" height="879" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, &#39;Liberation Sans&#39;, sans-serif">
<text x="24" y="46" font-size="21" font-weight="600" fill="#111827">Does sharing a job among 8 workers help?</text>
<text x="24" y="72" font-size="16" font-weight="600" fill="#111827">Yes, but far from 8×: with one job shared by 8 workers, each job finished 1.7–3.7× faster than with 1 worker</text>
<text x="24" y="94" font-size="16" font-weight="600" fill="#111827">(8× would be a perfect split). Acumatica ran on about 2 processor cores on every database, which limits</text>
<text x="24" y="116" font-size="16" font-weight="600" fill="#111827">the gain.</text>
<text x="24" y="140" font-size="13" fill="#4b5563">Acumatica 2026 R2 · median of 6 runs per test and database · one shared scale from zero · a longer bar means more gain from 8 workers, not</text>
<text x="24" y="160" font-size="13" fill="#4b5563">a faster database</text>
<rect x="24" y="179" width="15" height="14" rx="3" fill="#64748b"/>
<text x="48" y="190" font-size="13"><tspan font-weight="600" fill="#111827">One colour for every bar:</tspan><tspan fill="#4b5563"> Speed-ups are not ranked: the verdicts compare times, not speed-ups. Which database was faster with 1</tspan></text>
<text x="48" y="208" font-size="13" fill="#4b5563">and with 8 workers is in the “Platform basics: bulk record work” chart above.</text>
