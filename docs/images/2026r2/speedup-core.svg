<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="Speed-up from 1 worker to 8 parallel workers">
<title>Speed-up from 1 worker to 8 parallel workers</title>
<defs><pattern id="capHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#4B5563" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="960" height="490" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#1F2937">
<text x="16" y="30" font-size="18" text-anchor="start" font-weight="600" fill="#1F2937">Speed-up from 1 worker to 8 parallel workers (same 10,000-record job or 80-page list)</text>
<text x="16" y="50" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Speed-up = median time with 1 worker / median time with 8 workers. 1× = no gain; 8× = perfect scaling. Higher is better.</text>
