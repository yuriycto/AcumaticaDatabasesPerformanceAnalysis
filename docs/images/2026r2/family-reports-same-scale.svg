<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="871" viewBox="0 0 960 871" role="img" aria-labelledby="family-reports-same-scale-title family-reports-same-scale-desc">
<title id="family-reports-same-scale-title">Reports &amp; month-end on shared scales — A noticeable difference in 1 of 4 tests</title>
<desc id="family-reports-same-scale-desc">Reports &amp; month-end on shared scales: A noticeable difference in 1 of 4 tests. Median per test for SQL Server, MySQL and PostgreSQL; tests measured the same way share one axis from zero, so bar lengths compare across tests; tests of very different size get separate axes. Scale 1 of 2 · Own scale for this test: 0 to 50 s – about 185× longer than any other test here: Deep paging and counting in a 300,000-line journal. Scale 2 of 2 · Same scale for these 3 tests: 0 to 300 ms: Sales by customer and month, Trial balance and GL account details for a year. Coloured bars mark differences a user would notice, grey bars ties and differences too small to notice. Sales by customer and month: No noticeable difference. Trial balance: No noticeable difference. GL account details for a year: No noticeable difference. Deep paging and counting in a 300,000-line journal: MySQL noticeably slower than both.</desc>
<rect x="0.5" y="0.5" width="959" height="870" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, &#39;Liberation Sans&#39;, sans-serif">
<text x="24" y="46"><tspan font-size="21" font-weight="600" fill="#111827">Reports &amp; month-end on shared scales</tspan><tspan font-size="15" fill="#111827" dx="14">A noticeable difference in 1 of 4 tests</tspan></text>
<text x="24" y="68" font-size="13" fill="#4b5563">Acumatica 2026 R2 · median of 6 runs per test and database · tests measured the same way share one axis from zero, so bar lengths</text>
<text x="24" y="90" font-size="13" fill="#4b5563">compare across tests; tests of very different size get separate axes</text>
<rect x="24" y="109" width="14" height="14" rx="3" fill="#0072B2"/>
<text x="44" y="120" font-size="13" font-weight="600" fill="#111827">SQL Server</text>
<rect x="142.7" y="109" width="14" height="14" rx="3" fill="#E69F00"/>
<text x="162.7" y="120" font-size="13" font-weight="600" fill="#111827">MySQL</text>
<rect x="234.8" y="109" width="14" height="14" rx="3" fill="#CC79A7"/>
<text x="254.8" y="120" font-size="13" font-weight="600" fill="#111827">PostgreSQL</text>
<rect x="24" y="135" width="5" height="14" fill="#0072B2"/>
<rect x="29" y="135" width="5" height="14" fill="#E69F00"/>
<rect x="34" y="135" width="5" height="14" fill="#CC79A7"/>
<text x="48" y="146" font-size="13"><tspan font-weight="600" fill="#111827">Coloured bar:</tspan><tspan fill="#4b5563"> this database is on one side of a difference you would notice: noticeably faster or noticeably slower than another</tspan></text>
<text x="48" y="164" font-size="13" fill="#4b5563">database in the same test.</text>
<rect x="24" y="175" width="15" height="14" rx="3" fill="#c9c8c0"/>
<text x="48" y="186" font-size="13"><tspan font-weight="600" fill="#111827">Grey bar:</tspan><tspan fill="#4b5563"> no difference you would notice against the others. “tie” means inside the test’s noise margin; “not noticeable” means real</tspan></text>
<text x="48" y="204" font-size="13" fill="#4b5563">but too small to feel (under 1 s per report or under 10%).</text>
<line x1="24" y1="240" x2="936" y2="240" stroke="#111827" stroke-width="1.5"/>
<rect x="24" y="252" width="912" height="52" rx="6" fill="#f6f8fa"/>
<text x="36" y="273" font-size="14"><tspan font-weight="600" fill="#111827">Scale 1 of 2 · Own scale for this test: 0 to 50 s</tspan><tspan font-size="13" fill="#4b5563"> – about 185× longer than any other test here</tspan></text>
<text x="458.5" y="295" font-size="12" text-anchor="middle" fill="#4b5563" style="font-variant-numeric: tabular-nums">0</text>
<text x="506.5" y="295" font-size="12" text-anchor="middle" fill="#4b5563" style="font-variant-numeric: tabular-nums">10 s</text>
<text x="554.5" y="295" font-size="12" text-anchor="middle" fill="#4b5563" style="font-variant-numeric: tabular-nums">20 s</text>
<text x="602.5" y="295" font-size="12" text-anchor="middle" fill="#4b5563" style="font-variant-numeric: tabular-nums">30 s</text>
<text x="650.5" y="295" font-size="12" text-anchor="middle" fill="#4b5563" style="font-variant-numeric: tabular-nums">40 s</text>
<text x="698.5" y="295" font-size="12" text-anchor="middle" fill="#4b5563" style="font-variant-numeric: tabular-nums">50 s</text>
<text x="24" y="324" font-size="14" font-weight="600" fill="#111827">Deep paging and counting in a</text>
<text x="24" y="342" font-size="14" font-weight="600" fill="#111827">300,000-line journal</text>
<text x="24" y="362" font-size="13.5" font-weight="600" fill="#111827">MySQL noticeably slower than both</text>
<text x="24" y="380" font-size="13" fill="#4b5563">19.9 s more per pass of 12 requests (70% slower).</text>
<text x="24" y="397" font-size="13" fill="#4b5563">SQL Server and PostgreSQL tie.</text>
<text x="458" y="322" font-size="12.5" fill="#4b5563">s per pass of 12 requests · lower is better</text>
