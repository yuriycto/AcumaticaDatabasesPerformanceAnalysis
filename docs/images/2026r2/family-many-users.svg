<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1004" viewBox="0 0 960 1004" role="img" aria-labelledby="family-manyusers-title family-manyusers-desc">
<title id="family-manyusers-title">Many simultaneous users — A noticeable difference in 1 of 6 tests</title>
<desc id="family-manyusers-desc">Many simultaneous users: A noticeable difference in 1 of 6 tests. Median per test for SQL Server, MySQL and PostgreSQL, each on its own scale from zero; coloured bars mark differences a user would notice, grey bars ties and differences too small to notice. Enter sales orders – 4 clerks working non-stop: Tie: no real winner. All within 58%, inside the 75% noise margin. Gaps are measured on the median time per order; the per-minute medians differ more because SQL Server’s runs varied 140–275/min. Enter sales orders – 8 clerks working non-stop: MySQL noticeably slower than PostgreSQL. 140 orders/min vs 154 orders/min (10% slower). SQL Server ties with both. Enter sales orders – 16 clerks working non-stop: Tie: no real winner. All within 11%, inside the 17% noise margin. Everyone sells the best-seller – 4 clerks working non-stop: Tie: no real winner. All within 13%, inside the 26% noise margin. Everyone sells the best-seller – 8 clerks working non-stop: Tie: no real winner. All within 27%, inside the 43% noise margin. Everyone sells the best-seller – 16 clerks working non-stop: Tie: no real winner. All within 13%, inside the 21% noise margin.</desc>
<rect x="0.5" y="0.5" width="959" height="1003" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, &#39;Liberation Sans&#39;, sans-serif">
<text x="24" y="46"><tspan font-size="21" font-weight="600" fill="#111827">Many simultaneous users</tspan><tspan font-size="15" fill="#111827" dx="14">A noticeable difference in 1 of 6 tests</tspan></text>
<text x="24" y="68" font-size="13" fill="#4b5563">Acumatica 2026 R2 · median of 6 runs per test and database · each test has its own scale, starting at zero</text>
<rect x="24" y="87" width="14" height="14" rx="3" fill="#0072B2"/>
<text x="44" y="98" font-size="13" font-weight="600" fill="#111827">SQL Server</text>
<rect x="142.7" y="87" width="14" height="14" rx="3" fill="#E69F00"/>
<text x="162.7" y="98" font-size="13" font-weight="600" fill="#111827">MySQL</text>
<rect x="234.8" y="87" width="14" height="14" rx="3" fill="#CC79A7"/>
<text x="254.8" y="98" font-size="13" font-weight="600" fill="#111827">PostgreSQL</text>
<rect x="24" y="113" width="5" height="14" fill="#0072B2"/>
<rect x="29" y="113" width="5" height="14" fill="#E69F00"/>
<rect x="34" y="113" width="5" height="14" fill="#CC79A7"/>
<text x="48" y="124" font-size="13"><tspan font-weight="600" fill="#111827">Coloured bar:</tspan><tspan fill="#4b5563"> this database is on one side of a difference you would notice: noticeably faster or noticeably slower than another</tspan></text>
<text x="48" y="142" font-size="13" fill="#4b5563">database in the same test.</text>
<rect x="24" y="153" width="15" height="14" rx="3" fill="#c9c8c0"/>
<text x="48" y="164" font-size="13"><tspan font-weight="600" fill="#111827">Grey bar:</tspan><tspan fill="#4b5563"> no difference you would notice against the others. “tie” means inside the test’s noise margin; “not noticeable” means real</tspan></text>
<text x="48" y="182" font-size="13" fill="#4b5563">but too small to feel (under 10%).</text>
<line x1="24" y1="218" x2="936" y2="218" stroke="#111827" stroke-width="1.5"/>
<text x="24" y="250" font-size="14" font-weight="600" fill="#111827">Enter sales orders –</text>
<text x="24" y="268" font-size="14" font-weight="600" fill="#111827">4 clerks working non-stop</text>
<text x="24" y="288" font-size="13.5" font-weight="600" fill="#4b5563">Tie: no real winner</text>
<text x="24" y="306" font-size="13" fill="#4b5563">All within 58%, inside the 75% noise margin. Gaps</text>
<text x="24" y="323" font-size="13" fill="#4b5563">are measured on the median time per order; the</text>
<text x="24" y="340" font-size="13" fill="#4b5563">per-minute medians differ more because SQL</text>
<text x="24" y="357" font-size="13" fill="#4b5563">Server’s runs varied 140–275/min.</text>
<text x="458" y="248" font-size="12.5" fill="#4b5563">orders per minute · higher is better</text>
