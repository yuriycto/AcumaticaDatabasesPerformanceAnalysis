<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="762" viewBox="0 0 960 762" role="img" aria-labelledby="family-screens-same-scale-title family-screens-same-scale-desc">
<title id="family-screens-same-scale-title">Everyday screens on one scale — No noticeable difference in any of the 4 tests</title>
<desc id="family-screens-same-scale-desc">Everyday screens on one scale: No noticeable difference in any of the 4 tests. Median per test for SQL Server, MySQL and PostgreSQL; all 4 tests share one axis from zero, so bar lengths compare across tests. Same scale for all 4 tests: 0 to 80 ms: Open a sales order, A customer&#39;s order history, Who bought this item? and Find a customer by part of the name. Coloured bars mark differences a user would notice, grey bars ties and differences too small to notice. Open a sales order: No noticeable difference. A customer&#39;s order history: No noticeable difference. Who bought this item?: Tie: no real winner. Find a customer by part of the name: No noticeable difference.</desc>
<rect x="0.5" y="0.5" width="959" height="761" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, &#39;Liberation Sans&#39;, sans-serif">
<text x="24" y="46"><tspan font-size="21" font-weight="600" fill="#111827">Everyday screens on one scale</tspan><tspan font-size="15" fill="#111827" dx="14">No noticeable difference in any of the 4 tests</tspan></text>
<text x="24" y="68" font-size="13" fill="#4b5563">Acumatica 2026 R2 · median of 6 runs per test and database · all 4 tests share one axis from zero, so bar lengths compare across tests</text>
<rect x="24" y="87" width="14" height="14" rx="3" fill="#0072B2"/>
<text x="44" y="98" font-size="13" font-weight="600" fill="#111827">SQL Server</text>
<rect x="142.7" y="87" width="14" height="14" rx="3" fill="#E69F00"/>
<text x="162.7" y="98" font-size="13" font-weight="600" fill="#111827">MySQL</text>
<rect x="234.8" y="87" width="14" height="14" rx="3" fill="#CC79A7"/>
<text x="254.8" y="98" font-size="13" font-weight="600" fill="#111827">PostgreSQL</text>
<rect x="24" y="113" width="5" height="14" fill="#0072B2"/>
<rect x="29" y="113" width="5" height="14" fill="#E69F00"/>
<rect x="34" y="113" width="5" height="14" fill="#CC79A7"/>
<text x="48" y="124" font-size="13"><tspan font-weight="600" fill="#111827">Coloured bar:</tspan><tspan fill="#4b5563"> this database is on one side of a difference you would notice: noticeably faster or noticeably slower than another</tspan></text>
<text x="48" y="142" font-size="13" fill="#4b5563">database in the same test.</text>
<rect x="24" y="153" width="15" height="14" rx="3" fill="#c9c8c0"/>
<text x="48" y="164" font-size="13"><tspan font-weight="600" fill="#111827">Grey bar:</tspan><tspan fill="#4b5563"> no difference you would notice against the others. “tie” means inside the test’s noise margin; “not noticeable” means real</tspan></text>
<text x="48" y="182" font-size="13" fill="#4b5563">but too small to feel (under 100 ms per screen action).</text>
<line x1="24" y1="218" x2="936" y2="218" stroke="#111827" stroke-width="1.5"/>
<rect x="24" y="230" width="912" height="52" rx="6" fill="#f6f8fa"/>
<text x="36" y="251" font-size="14" font-weight="600" fill="#111827">Same scale for all 4 tests: 0 to 80 ms</text>
