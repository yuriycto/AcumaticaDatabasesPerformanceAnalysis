<template>
	<qp-tabbar id="BenchmarkTab" active-tab-id="OverviewTab" wg-container>
		<qp-tab id="OverviewTab" caption="Overview">
			<qp-template id="OverviewTemplate" name="1-1">
				<div slot="A">
					<qp-fieldset id="RunATest" view.bind="Filter" caption="Run a test" class="label-size-m">
						<field name="SelectedTestCode"></field>
						<field name="WorkScale"></field>
						<field name="PassesOverride"></field>
						<field name="WarmUpPassesOverride"></field>
						<field name="RunBudgetSec"></field>
						<field name="CampaignID"></field>
						<field name="RepetitionNo"></field>
					</qp-fieldset>

					<div class="benchmark-run-actions" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 0 0 16px 0;">
						<qp-button id="btnRunBenchmark" state.bind="RunBenchmark" title="Runs the test selected in 'Test to Run' with the parameters above." class="major-button" style="width: 100%; min-height: 40px;"></qp-button>
						<qp-button id="btnAbortBenchmark" state.bind="AbortBenchmark" title="Asks the run in progress on this instance to stop after its current operation; it is stored as Invalid (Aborted)." style="width: 100%; min-height: 40px;"></qp-button>
						<qp-button id="btnClearTestRecords" state.bind="ClearTestRecords" title="Deletes benchmark work records other than the two seed batches and documents left by interrupted runs. Results are kept." style="width: 100%; min-height: 40px;"></qp-button>
					</div>

					<qp-fieldset id="CampaignContext" view.bind="Filter" caption="Campaign Context (set by the suite)" class="label-size-m">
						<field name="IsWarmup"></field>
						<field name="RunBlock"></field>
						<field name="OrderPosition"></field>
					</qp-fieldset>

					<qp-fieldset id="Environment" view.bind="Filter" caption="Current Environment" class="label-size-m">
						<field name="SetupID"></field>
						<field name="CurrentDatabase"></field>
						<field name="CurrentInstance"></field>
						<field name="ServerMethodologyVersion"></field>
						<field name="ServerAppStartUtc"></field>
						<field name="ServerDllSha256"></field>
						<field name="DetectedCpuCores"></field>
						<field name="DetectedMemoryGb"></field>
						<field name="HardwareRecommendationSummary"></field>
						<field name="SnapshotStatus"></field>
						<field name="PendingAnalysisStatus"></field>
						<field name="LastRequestID"></field>
						<field name="LastRequestedTestCode"></field>
						<field name="LastRequestedBenchmark"></field>
						<field name="LastRequestStatus"></field>
						<field name="LastRequestStartedAtUtc"></field>
						<field name="LastRequestCompletedAtUtc"></field>
						<field name="LastRequestElapsedMs"></field>
						<field name="LastRequestMessage"></field>
					</qp-fieldset>

					<qp-fieldset id="Parameters" view.bind="Filter" caption="Platform Basics Parameters" class="label-size-m">
						<field name="NumberOfRecords"></field>
						<field name="Iterations"></field>
						<field name="ParallelBatchSize"></field>
						<field name="ParallelMaxThreads"></field>
						<field name="RecommendedRecords"></field>
						<field name="RecommendedIterations"></field>
						<field name="RecommendedBatchSize"></field>
						<field name="RecommendedMaxThreads"></field>
					</qp-fieldset>
				</div>
				<div slot="B">
					<div class="benchmark-summary" style="margin-bottom: 16px;">
						<h3 style="margin: 0 0 8px 0;">PerfDBBenchmark</h3>
						<p style="margin: 0 0 6px 0;">
							Pick a test in <b>Test to Run</b> and click <b>Run Benchmark</b>. Run the same test with the same parameters on PerfPG, PerfMySQL and PerfSQL to compare the three database engines.
						</p>
						<p style="margin: 0 0 6px 0;">
							<b>Run Budget</b> limits one run (0 or empty = 15 minutes); a run that hits it is stored as Capped. <b>Abort Benchmark</b> stops the run in progress after its current operation.
						</p>
						<p style="margin: 0 0 6px 0;">
							Tests with 16 workers need <code>&lt;ThreadPoolSize&gt;32&lt;/ThreadPoolSize&gt;</code> inside <code>&lt;px.core&gt;</code> in web.config.
						</p>
						<p style="margin: 0;">
							The comparison on this screen is indicative only. Published verdicts come from the report generator (scripts\New-PerfDBBenchmarkReport.ps1), which uses six repetitions and the tie rule.
						</p>
					</div>

					<div class="benchmark-actions" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px;">
						<qp-button id="btnApplyRecommended" state.bind="ApplyRecommendedSettings" class="major-button" style="width: 100%; min-height: 40px;"></qp-button>
						<qp-button id="btnRefreshStatus" state.bind="RefreshStatus" title="Reloads snapshot and pending-analysis status so you can validate current benchmark coverage." class="major-button" style="width: 100%; min-height: 40px;"></qp-button>
						<qp-button id="btnExportExcel" state.bind="ExportToExcel" style="width: 100%; min-height: 40px;"></qp-button>
						<qp-button id="btnClearData" state.bind="ClearTestData" style="width: 100%; min-height: 40px;"></qp-button>
					</div>

					<details id="LegacyButtons" style="border: 1px solid #dbe3ee; border-radius: 6px; padding: 8px 12px;">
						<summary style="cursor: pointer; font-weight: 600;">Legacy buttons (the 12 original tests; each starts the matching platform-basics test)</summary>
						<fieldset style="border: 0; margin: 10px 0 0 0; padding: 0;">
							<div class="benchmark-legacy-actions" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
								<qp-button id="btnSeqRead" state.bind="RunSequentialRead" title="Load 10,000 records - 1 worker (CORE_READ_1U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnSeqWrite" state.bind="RunSequentialWrite" title="Save 10,000 new records - 1 worker (CORE_INSERT_1U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnSeqUpdate" state.bind="RunSequentialUpdate" title="Change 10,000 records - 1 worker (CORE_UPDATE_1U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnSeqDelete" state.bind="RunSequentialDelete" title="Delete 10,000 records - 1 worker (CORE_DELETE_1U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnSeqComplex" state.bind="RunSequentialComplexJoin" title="Stock availability list, all columns - 1 worker (CORE_JOIN_FULL_1U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnSeqProjection" state.bind="RunSequentialProjection" title="Stock availability list, only the needed columns - 1 worker (CORE_JOIN_SLIM_1U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnParRead" state.bind="RunParallelRead" title="Load 10,000 records - one job shared by 8 parallel workers (CORE_READ_8U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnParWrite" state.bind="RunParallelWrite" title="Save 10,000 new records - one job shared by 8 parallel workers (CORE_INSERT_8U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnParUpdate" state.bind="RunParallelUpdate" title="Change 10,000 records - one job shared by 8 parallel workers (CORE_UPDATE_8U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnParDelete" state.bind="RunParallelDelete" title="Delete 10,000 records - one job shared by 8 parallel workers (CORE_DELETE_8U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnParComplex" state.bind="RunParallelComplexJoin" title="Stock availability list, all columns - 8 parallel workers (CORE_JOIN_FULL_8U)." style="width: 100%; min-height: 36px;"></qp-button>
								<qp-button id="btnParProjection" state.bind="RunParallelProjection" title="Stock availability list, only the needed columns - 8 parallel workers (CORE_JOIN_SLIM_8U)." style="width: 100%; min-height: 36px;"></qp-button>
							</div>
						</fieldset>
					</details>
				</div>
			</qp-template>
		</qp-tab>

		<qp-tab id="BenchmarkCatalogTab" caption="Benchmark Catalog">
			<qp-grid id="gridBenchmarkCatalog" view.bind="BenchmarkCatalog"></qp-grid>
		</qp-tab>

		<qp-tab id="LocalResultsTab" caption="Local Results">
			<qp-grid id="gridLocalResults" view.bind="LocalResults"></qp-grid>
		</qp-tab>

		<qp-tab id="ResultsTab" caption="Comparison Results">
			<qp-grid id="gridResults" view.bind="ComparisonResults"></qp-grid>
		</qp-tab>

		<qp-tab id="VisualizationTab" caption="Visualization">
			<div class="benchmark-summary" style="margin-bottom: 16px;">
				<p style="margin: 0 0 6px 0;">
					One chart per family. Each test is shown on its own relative scale: 1.00&times; is the fastest engine on that test, and the bar end label shows the ratio and the absolute median. Lower is better.
				</p>
				<p style="margin: 0;">
					${VisualizationStatus}
				</p>
			</div>

			<div if.bind="hasVisualizationData">
				<div repeat.for="chart of VisualizationCharts" style="margin-bottom: 22px;">
					<div style="font-weight: 600; margin: 0 0 10px 0;">${chart.title}</div>
					<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px;">
						<div repeat.for="legendItem of chart.legend" style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #334155;">
							<span style.bind="'display:inline-block;width:12px;height:12px;border-radius:2px;background:' + legendItem.color"></span>
							<span>${legendItem.name}</span>
						</div>
					</div>
					<div style="overflow-x: auto; border: 1px solid #dbe3ee; border-radius: 6px; background: #ffffff; padding: 8px;">
						<svg width.bind="chart.width" height.bind="chart.height" style="display: block; width: 100%; min-width: 980px;">
							<rect x="0" y="0" width.bind="chart.width" height.bind="chart.height" fill="#ffffff"></rect>
							<g repeat.for="tick of chart.ticks">
								<line x1.bind="tick.x" y1.bind="chart.plotTop" x2.bind="tick.x" y2.bind="chart.plotBottom" stroke="#e5e7eb" stroke-width="1"></line>
								<text x.bind="tick.x" y.bind="chart.plotTop - 4" text-anchor="middle" font-size="11" fill="#475569">${tick.label}</text>
							</g>
							<line x1.bind="chart.oneX" y1.bind="chart.plotTop" x2.bind="chart.oneX" y2.bind="chart.plotBottom" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"></line>

							<g repeat.for="group of chart.groups">
								<text x="4" y.bind="group.labelY" font-size="12" font-weight="600" fill="#0f172a">${group.label}</text>
								<g repeat.for="bar of group.bars">
									<text x.bind="bar.engineLabelX" y.bind="bar.textY" text-anchor="end" font-size="11" fill="#334155">${bar.engineLabel}</text>
									<rect x.bind="bar.x" y.bind="bar.y" width.bind="bar.width" height.bind="bar.height" fill.bind="bar.color">
										<title>${bar.tooltip}</title>
									</rect>
									<text x.bind="bar.valueLabelX" y.bind="bar.textY" font-size="11" fill="#0f172a">${bar.valueLabel}</text>
								</g>
							</g>
						</svg>
					</div>
				</div>

				<qp-grid id="gridVisualizationResults" view.bind="ComparisonResults"></qp-grid>
			</div>
		</qp-tab>
	</qp-tabbar>
</template>
